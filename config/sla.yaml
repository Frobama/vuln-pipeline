# Plazo de remediación en días corridos, según la severidad EFECTIVA del hallazgo
# (la que resulta de aplicar config/rules.yaml). El reloj parte el día en que se crea el ticket.
sla_days:
  critical: 3
  high: 7
  medium: 30
  low: 90
  info: 180

# Avisar cuando falten N días o menos para el vencimiento (por severidad).
# Debe ser menor que el plazo de sla_days.
warn_before_days:
  critical: 1
  high: 2
  medium: 7
  low: 14
  info: 30
